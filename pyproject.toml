[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gradientclimb"
version = "0.1.0a1"
description = "Research infrastructure for rapid-learning adaptive control and sim-to-real transfer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "gymnasium>=1.1", "duckdb>=1.2", "pyarrow>=18", "pydantic>=2.10", "psutil>=6", "pillow>=11", "scipy>=1.14", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
train = ["torch>=2.6"]
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.27"]
capture = ["mss>=10", "opencv-python-headless>=4.10"]

[project.scripts]
gradientclimb = "gradientclimb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradientclimb = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
